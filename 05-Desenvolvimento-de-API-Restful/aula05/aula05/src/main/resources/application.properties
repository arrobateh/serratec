spring.application.name=aula05

# Ativa a interface visual no navegador
spring.h2.console.enabled=true

# O caminho que você vai digitar no navegador (pode ser qualquer nome)
spring.h2.console.path=/h2-console

# O NOME do seu banco (isso aqui é o segredo!)
spring.datasource.url=jdbc:h2:mem:aula05db

# Login padrão (sa = System Administrator)
spring.datasource.username=sa
spring.datasource.password=1234

# Driver necessário
spring.datasource.driverClassName=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true